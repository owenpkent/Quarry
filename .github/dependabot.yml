version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pip"
    directory: "/tools/sidecar"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/prototypes/synthesia_detector"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # JUCE is pinned deliberately to a security tag, and JUCE 9 is a planned,
  # separate migration, so major bumps are ignored. Minor and patch bumps still
  # open a PR for review. Note: for gitsubmodule, Dependabot tracks the
  # submodule's branch head, so check the proposed commit is a tagged release.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "ThirdParty/JUCE"
        update-types: ["version-update:semver-major"]
